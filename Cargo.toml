[package]
name = "pasties"
version = "0.1.0"
edition = "2024"

[dependencies]
ammonia = "4.1.3"
anyhow = "1.0.103"
argon2 = "0.5.3"
axum = "0.8.9"
base64 = "0.22.1"
chrono = "0.4.45"
maud = { version = "0.27.0", features = [ "axum" ] }
paste = "1.0.15"
rand = "0.10.2"
regex = "1.13.0"
serde = "1.0.228"
serde_valid = "2.0.3"
sha2 = "0.11.0"
snof = "0.1.0"
sqlx = { version = "0.8.6", features = [ "runtime-tokio", "postgres", "chrono" ] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = [ "rt", "rt-multi-thread", "macros" ]}
toml = "1.1.2"
url = "2.5.8"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
