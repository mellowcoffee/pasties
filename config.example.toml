[server]
bind = "0.0.0.0:8080"

[database]
url = "postgres://user:pass@localhost:5432/pasties"
max_connections = 16

[moderation]
max_pages_per_user = 5000
login_attempts_per_minute = 5
registrations_per_hour_per_ip = 5

[limits]
bio_max_len = 512
password_min_len = 6
password_max_len = 128
avatar_url_max_len = 512
html_max_bytes = 262144
css_max_bytes = 131072

[registration]
require_invite = true

[session]
cookie_name = "session"
lifetime_days = 365
